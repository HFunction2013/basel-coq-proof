name: Coq CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq_version: ['8.18', '8.19', '8.20']
    steps:
      - uses: actions/checkout@v4

      # 启动容器但不自动跑构建脚本
      - name: Start Coq ${{ matrix.coq_version }} container
        id: container
        uses: coq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.coq_version }}
          # 空脚本，只用来起容器
          script: true

      # 进容器改权限（关键：必须在这个容器步里、coq_makefile 之前）
      - name: Fix permissions inside container
        run: |
          docker exec ${{ steps.container.outputs.container_id }} sh -c "chmod -R a+u /github/workspace && chown -R coq:coq /github/workspace"

      # 构建（不写 before_script）
      - name: Build with Coq ${{ matrix.coq_version }}
        uses: coq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.coq_version }}
          container_id: ${{ steps.container.outputs.container_id }}
          script: |
            coq_makefile -f _CoqProject -o CoqMakefile
            make -f CoqMakefile all

      - name: Upload 8.20 artifacts
        if: matrix.coq_version == '8.20'
        uses: actions/upload-artifact@v4
        with:
          name: coq-build-8.20
          path: |
            **/*.vo
            **/*.glob
            CoqMakefile
            Makefile.coq*
          if-no-files-found: warn
          retention-days: 7
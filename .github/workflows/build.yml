name: Coq CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq_version: ['8.18', '8.19', '8.20']
    steps:
      - uses: actions/checkout@v4

      - name: Install Coq ${{ matrix.coq_version }}
        uses: coq-community/coq-action@v1
        with:
          coq_version: ${{ matrix.coq_version }}

      - name: Build with Coq ${{ matrix.coq_version }}
        run: |
          coq_makefile -f _CoqProject -o CoqMakefile
          make -f CoqMakefile all

      # 只有 8.20 才上传产物
      - name: Upload Coq 8.20 artifacts
        if: matrix.coq_version == '8.20'
        uses: actions/upload-artifact@v4
        with:
          name: coq-build-8.20
          path: |
            **/*.vo
            **/*.glob
            CoqMakefile
            Makefile.coq*
          if-no-files-found: warn
          retention-days: 7
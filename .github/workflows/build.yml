name: Coq CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coq_version: ['8.18', '8.19', '8.20']
    steps:
      - uses: actions/checkout@v4

      - name: Build with Coq ${{ matrix.coq_version }}
        uses: coq-community/docker-coq-action@v1
        with:
          coq_version: ${{ matrix.coq_version }}
          before_script: |
            startGroup "fix perms"
            sudo chmod -R a=u .
            git config --global --add safe.directory "*"
            id
            pwd
            ls -ld .
            endGroup
          custom_script: |
            startGroup "gen makefile"
            test -f _CoqProject || { echo "_CoqProject missing"; exit 1; }
            coq_makefile -f _CoqProject -o CoqMakefile
            endGroup
            startGroup "make all"
            make -f CoqMakefile all
            endGroup

      - name: Upload 8.20 artifacts
        if: matrix.coq_version == '8.20'
        uses: actions/upload-artifact@v4
        with:
          name: coq-build-8.20
          path: |
            **/*.vo
            **/*.glob
            CoqMakefile
            Makefile.coq*
          if-no-files-found: warn
          retention-days: 7